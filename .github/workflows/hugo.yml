name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Install Typst
        run: |
          TYPST_URL=$(curl -fsSL https://api.github.com/repos/typst/typst/releases/latest \
            | grep "browser_download_url" \
            | grep "x86_64-unknown-linux-musl\.tar\.xz" \
            | cut -d'"' -f4)
          curl -fsSL "$TYPST_URL" | tar -xJ -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst

      - name: Generate CV PDF
        run: typst compile --font-path static/fonts cv.typ public/cv.pdf

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages

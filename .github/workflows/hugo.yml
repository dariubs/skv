name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Install Pandoc and XeLaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra

      - name: Install Tilda Sans font
        run: |
          sudo mkdir -p /usr/local/share/fonts/tildasans
          sudo cp static/fonts/TildaSans-VF.ttf /usr/local/share/fonts/tildasans/
          sudo fc-cache -f

      - name: Generate CV PDF
        run: |
          pandoc cv.md -o public/cv.pdf \
            --template=themes/academic/cv.tex \
            --pdf-engine=xelatex \
            --strip-comments

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
